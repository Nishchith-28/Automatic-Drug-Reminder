{% extends "base.html" %}
{% block title %}Log in — Dosely{% endblock %}
{% block content %}
<div class="auth-shell">
  <div class="card">
    <h1 style="font-size:1.5rem">Log in</h1>
    <p class="muted" style="margin-bottom:22px">Doctor, patient or guardian — same form, we'll route you to the right dashboard.</p>
    <form method="POST" action="{{ url_for('login') }}" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" value="{{ email }}" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn-solid btn-block">Log in</button>
    </form>
    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
